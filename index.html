<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年輕單成中心報帳系統 - 網站遷移通知</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f1f5f9;
        }
        .animate-bounce-slow {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(-5%); animation-timing-function: cubic-bezier(0.8, 0, 1, 1); }
            50% { transform: translateY(0); animation-timing-function: cubic-bezier(0, 0, 0.2, 1); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- 遷移通知面板 -->
    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md text-center border border-indigo-100">
        <div class="mb-6 flex justify-center">
            <div class="bg-indigo-100 p-4 rounded-full">
                <i data-lucide="map-pin-off" class="text-indigo-600 w-12 h-12"></i>
            </div>
        </div>
        
        <h1 class="text-2xl font-bold text-gray-800 mb-2">網站已遷移</h1>
        <p class="text-gray-500 mb-8">
            此報帳系統頁面即將停用，<br>
            我們正在為您轉導至新版系統。
        </p>

        <!-- 載入條 -->
        <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden mb-6">
            <div id="progress-bar" class="bg-indigo-600 h-full w-0 transition-all duration-1000 ease-out"></div>
        </div>

        <div class="flex flex-col gap-3">
            <p class="text-sm text-indigo-600 font-medium flex items-center justify-center gap-2">
                <i data-lucide="loader-2" class="animate-spin w-4 h-4"></i>
                即將跳轉...
            </p>
            
            <a href="https://weichun0203.github.io/YSA-institute/" 
               class="mt-4 text-xs text-gray-400 hover:text-indigo-500 underline transition-colors">
                如果沒有自動跳轉，請點擊此處
            </a>
        </div>
    </div>

    <script>
        const TARGET_URL = 'https://weichun0203.github.io/YSA-institute/';

        window.onload = () => {
            // 初始化圖示
            lucide.createIcons();

            // 啟動進度條動畫
            const progressBar = document.getElementById('progress-bar');
            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 50);

            // 1秒後執行跳轉
            setTimeout(() => {
                window.location.replace(TARGET_URL);
            }, 1500);
        };
    </script>
</body>
</html>
